# Haushalt mit Docker Compose
#
#   docker compose up -d --build     starten (baut das Image beim ersten Mal)
#   docker compose logs -f           Logs ansehen
#   docker compose down              stoppen (Daten bleiben im Volume erhalten)
#
# Einstellungen stehen in .env (Vorlage: .env.example).

services:
  haushalt:
    build: .
    image: haushalt:latest
    container_name: haushalt
    restart: unless-stopped
    init: true
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      SESSION_SECRET: ${SESSION_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      ASSET_STALE_MONTHS: ${ASSET_STALE_MONTHS:-6}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - haushalt-data:/app/data

volumes:
  haushalt-data:
